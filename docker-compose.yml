# Stack de développement local : base de données + Redis.
# Lance l'app avec : py manage.py runserver  (et celery en local si besoin).

services:
  db:
    image: postgres:16-alpine
    container_name: pcs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcs_db
      POSTGRES_USER: pcs_user
      POSTGRES_PASSWORD: pcs_password
    ports:
      - "5432:5432"
    volumes:
      - pcs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs_user -d pcs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pcs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pcs_redisdata:/data

volumes:
  pcs_pgdata:
  pcs_redisdata:
