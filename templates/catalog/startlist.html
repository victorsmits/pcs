{% extends 'base.html' %}

{% block content %}
<div x-data="startlistApp()">

  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <a href="{% url 'catalog:race_detail' slug=race.slug year=race.year %}"
         class="text-sm text-slate-400 hover:text-fg">&larr; {{ race.name }} {{ race.year }}</a>
      <h1 class="mt-1 text-2xl font-bold">Engagés <span class="num text-lg text-slate-500">{{ count }}</span></h1>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <span class="text-slate-500">Grouper par</span>
      <div class="flex gap-1 rounded-lg bg-ink-800 p-1">
        <button @click="groupBy='team'" :class="groupBy==='team' ? 'bg-brand-600 text-white' : 'text-slate-400 hover:text-fg'" class="rounded px-3 py-1">Équipe</button>
        <button @click="groupBy='nat'" :class="groupBy==='nat' ? 'bg-brand-600 text-white' : 'text-slate-400 hover:text-fg'" class="rounded px-3 py-1">Nationalité</button>
        <button @click="groupBy='none'" :class="groupBy==='none' ? 'bg-brand-600 text-white' : 'text-slate-400 hover:text-fg'" class="rounded px-3 py-1">A→Z</button>
      </div>
    </div>
  </div>

  <template x-if="!entries.length">
    <div class="card card-pad text-sm text-slate-400">Liste des engagés non disponible.</div>
  </template>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <template x-for="g in groups" :key="g.label">
      <div class="card card-pad">
        <h2 class="mb-2 flex items-center justify-between gap-2 text-sm font-semibold text-fg">
          <span x-text="g.label"></span>
          <span class="num text-xs text-slate-500" x-text="g.items.length"></span>
        </h2>
        <div class="divide-y divide-ink-700/70">
          <template x-for="r in g.items" :key="r.rider_url">
            <a :href="r.rider_url" class="-mx-1 flex items-center gap-2 rounded px-1 py-1.5 text-sm hover:bg-ink-800">
              <span class="num w-7 shrink-0 text-xs text-slate-500" x-text="r.bib || ''"></span>
              <span class="truncate" x-text="r.name"></span>
              <span class="num ml-auto text-xs text-slate-500" x-text="r.nat"></span>
            </a>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
  const SL_ENTRIES = {{ entries_json|safe }};
  function startlistApp() {
    return {
      groupBy: 'team',
      entries: SL_ENTRIES,
      get groups() {
        if (this.groupBy === 'none') {
          const items = [...this.entries].sort((a, b) => a.name.localeCompare(b.name));
          return [{ label: 'Tous les coureurs', items }];
        }
        const key = this.groupBy === 'team' ? 'team' : 'nat';
        const map = {};
        for (const e of this.entries) { const k = e[key] || '—'; (map[k] = map[k] || []).push(e); }
        return Object.keys(map).sort().map(k => ({
          label: k,
          items: map[k].sort((a, b) => (a.bib || 999) - (b.bib || 999) || a.name.localeCompare(b.name)),
        }));
      },
    };
  }
</script>
{% endblock %}
