{% extends 'base.html' %}

{% block content %}

<h1 class="text-2xl font-bold mb-4">Équipes</h1>
<div class="card divide-y divide-ink-700/70">
  {% for t in teams %}
  <a href="{% url 'catalog:team_detail' slug=t.slug year=t.year %}" class="flex items-center justify-between px-4 py-3 hover:bg-ink-800">
    <span>{{ t.name }}</span><span class="num text-xs text-slate-400">{{ t.level }}</span>
  </a>
  {% empty %}<p class="px-4 py-3 text-sm text-slate-400">—</p>{% endfor %}
</div>

{% include 'components/pager.html' %}
{% endblock %}
